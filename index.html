<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mongewell Byre — Family Hub</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C7A5E">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body data-page="home" class="gate-locked">

<header class="top" id="app-header"></header>
<div id="authGate"></div>

<main>
  <section class="today-section">
    <h2>Today</h2>
    <div id="todayList"></div>
  </section>

  <section class="glance-section" id="glanceSection" style="display:none">
    <h2>Coming up</h2>
    <div id="glanceList"></div>
  </section>
</main>

<p class="status-note" id="statusNote" style="display:none"></p>

<nav class="tabs" id="app-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="db.js"></script>
<script src="push.js"></script>
<script src="layout.js"></script>
<script>
(function () {
  function showStatus(msg) {
    const el = document.getElementById('statusNote');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  function rowHtml(r) {
    return '<a class="glance-row" href="' + r.href + '">' +
      '<span class="glance-icon">' + icon(r.icon, 20) + '</span>' +
      '<div class="event-main"><div class="event-title">' + escapeHtml(r.label) + '</div>' +
      (r.meta ? '<div class="event-meta">' + escapeHtml(r.meta) + '</div>' : '') + '</div>' +
      '<span class="glance-chev">›</span></a>';
  }

  if (!window.sb) {
    showStatus('Add your Supabase project keys to config.js to bring this to life.');
    return;
  }

  // Today's events — the one thing always shown, even when empty
  window.sb.from('events').select('*').eq('date', todayISO()).order('time', { ascending: true })
    .then(({ data, error }) => {
      const el = document.getElementById('todayList');
      if (error) { el.innerHTML = '<p class="event-meta">Could not load today\'s events.</p>'; return; }
      if (!data.length) { el.innerHTML = '<p class="event-meta">Nothing on today. Enjoy the quiet.</p>'; return; }
      el.innerHTML = data.map(e =>
        '<div class="event-row" style="cursor:default">' +
        '<span class="dot ' + e.category + '"></span>' +
        '<div class="event-main"><div class="event-title">' + escapeHtml(e.title) + '</div>' +
        (e.time ? '<div class="event-meta">' + escapeHtml(formatTime(e.time)) + '</div>' : '') +
        '</div></div>'
      ).join('');
    });

  // Everything else collapses into one compact list, and only the rows that
  // actually have something to say appear at all.
  Promise.all([
    window.sb.from('clubs').select('*').eq('day_of_week', new Date().getDay()).order('start_time', { ascending: true }),
    window.sb.from('events').select('*').in('category', ['birthday', 'anniversary']).eq('recurring', true),
    window.sb.from('shopping_items').select('*').eq('checked', false),
    window.sb.from('school_dates').select('*').gte('date', todayISO()).order('date', { ascending: true }).limit(1),
    window.sb.from('holidays').select('*').gte('start_date', todayISO()).order('start_date', { ascending: true }).limit(1),
  ]).then(([clubsRes, bdayRes, shopRes, schoolRes, holRes]) => {
    const rows = [];

    if (!clubsRes.error && clubsRes.data.length) {
      const names = clubsRes.data.map(c => c.name).join(', ');
      const times = clubsRes.data.map(c => formatTime(c.start_time)).filter(Boolean).join(', ');
      rows.push({ icon: 'dumbbell', href: 'clubs.html', label: names + ' today', meta: times });
    }

    if (!bdayRes.error && bdayRes.data.length) {
      const upcoming = bdayRes.data
        .map(e => Object.assign({}, e, { occ: nextOccurrence(e.date) }))
        .filter(e => daysUntil(e.occ) <= 30)
        .sort((a, b) => a.occ.localeCompare(b.occ));
      if (upcoming.length) {
        const e = upcoming[0];
        const label = e.category === 'anniversary' ? yearsAt(e.date) + ' years' : 'turns ' + yearsAt(e.date);
        rows.push({
          icon: e.category === 'anniversary' ? 'rings' : 'cake',
          href: 'calendar.html',
          label: e.title,
          meta: formatDayHeading(e.occ) + ' · ' + label,
        });
      }
    }

    if (!shopRes.error && shopRes.data.length) {
      const n = shopRes.data.length;
      rows.push({ icon: 'basket', href: 'shopping.html', label: n + ' item' + (n === 1 ? '' : 's') + ' on the shopping list', meta: '' });
    }

    if (!schoolRes.error && schoolRes.data.length) {
      const e = schoolRes.data[0];
      rows.push({ icon: 'backpack', href: 'school.html', label: e.title, meta: formatDayHeading(e.date) });
    }

    if (!holRes.error && holRes.data.length) {
      const h = holRes.data[0];
      const n = daysUntil(h.start_date);
      rows.push({ icon: 'suitcase', href: 'holidays.html', label: h.title, meta: n + ' day' + (n === 1 ? '' : 's') + ' to go' });
    }

    if (rows.length) {
      document.getElementById('glanceSection').style.display = 'block';
      document.getElementById('glanceList').innerHTML = rows.map(rowHtml).join('');
    }
  });
})();
</script>
</body>
</html>
