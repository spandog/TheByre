<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mongewell Byre — Family Hub</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C7A5E">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body data-page="home">

<header class="top" id="app-header"></header>

<main>
  <svg class="home-hero" viewBox="0 0 400 92" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M0 74c40-6 70 4 100-2s55-14 90-8 60 10 95 4 75-10 115-2" />
    <g class="accent" stroke-width="1.6">
      <path d="M150 58 182 34l32 24" />
      <path d="M160 56v22a2 2 0 0 0 2 2h40a2 2 0 0 0 2-2V56" />
      <path d="M175 80V68h14v12" />
    </g>
    <path d="M60 66c3-10 2-18-4-26M64 40c5 3 6 9 4 15" />
    <path d="M330 64c3-9 2-16-3-23M334 41c4 3 5 8 3 13" />
    <circle cx="256" cy="20" r="9" />
  </svg>

  <div class="hub-card">
    <h3><span id="icoToday"></span>Today</h3>
    <div id="todayList"></div>
  </div>

  <div class="hub-card">
    <h3><span id="icoClubs"></span>Clubs today</h3>
    <div id="clubsToday"></div>
    <a class="see-all" href="clubs.html">See all clubs →</a>
  </div>

  <div class="hub-card">
    <h3><span id="icoBday"></span>Coming up</h3>
    <div id="birthdaySnapshot"></div>
  </div>

  <div class="hub-card">
    <h3><span id="icoShop"></span>Shopping list</h3>
    <div id="shopSnapshot"></div>
    <a class="see-all" href="shopping.html">Open the full list →</a>
  </div>

  <div class="hub-card">
    <h3><span id="icoSchool"></span>Next up at school</h3>
    <div id="schoolSnapshot"></div>
    <a class="see-all" href="school.html">See term dates →</a>
  </div>

  <div class="hub-card">
    <h3><span id="icoHol"></span>Next holiday</h3>
    <div id="holidaySnapshot"></div>
    <a class="see-all" href="holidays.html">See details →</a>
  </div>
</main>

<p class="status-note" id="statusNote" style="display:none"></p>

<nav class="tabs" id="app-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="db.js"></script>
<script src="layout.js"></script>
<script>
(function () {
  document.getElementById('icoToday').innerHTML = icon('clock');
  document.getElementById('icoClubs').innerHTML = icon('dumbbell');
  document.getElementById('icoBday').innerHTML = icon('cake');
  document.getElementById('icoShop').innerHTML = icon('basket');
  document.getElementById('icoSchool').innerHTML = icon('backpack');
  document.getElementById('icoHol').innerHTML = icon('suitcase');

  function showStatus(msg) {
    const el = document.getElementById('statusNote');
    el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
  }

  if (!window.sb) {
    showStatus('Add your Supabase project keys to config.js to bring this to life.');
    return;
  }

  // Today's events
  window.sb.from('events').select('*').eq('date', todayISO()).order('time', { ascending: true })
    .then(({ data, error }) => {
      const el = document.getElementById('todayList');
      if (error) { el.innerHTML = '<p class="event-meta">Could not load today\'s events.</p>'; return; }
      if (!data.length) { el.innerHTML = '<p class="event-meta">Nothing on today. Enjoy the quiet.</p>'; return; }
      el.innerHTML = data.map(e =>
        '<div class="event-row" style="cursor:default">' +
        '<span class="dot ' + e.category + '"></span>' +
        '<div class="event-main"><div class="event-title">' + escapeHtml(e.title) + '</div>' +
        (e.time ? '<div class="event-meta">' + escapeHtml(formatTime(e.time)) + '</div>' : '') +
        '</div></div>'
      ).join('');
    });

  // Clubs today
  window.sb.from('clubs').select('*').eq('day_of_week', new Date().getDay()).order('start_time', { ascending: true })
    .then(({ data, error }) => {
      const el = document.getElementById('clubsToday');
      if (error) { el.innerHTML = '<p class="event-meta">Could not load clubs.</p>'; return; }
      if (!data.length) { el.innerHTML = '<p class="event-meta">Nothing on today.</p>'; return; }
      el.innerHTML = data.map(c =>
        '<div class="event-row" style="cursor:default"><span class="dot activity"></span>' +
        '<div class="event-main"><div class="event-title">' + escapeHtml(c.name) + (c.child ? ' — ' + escapeHtml(c.child) : '') + '</div>' +
        '<div class="event-meta">' + [formatTime(c.start_time), c.address].filter(Boolean).join(' · ') + '</div></div></div>'
      ).join('');
    });

  // Birthdays and anniversaries in the next 30 days
  window.sb.from('events').select('*').in('category', ['birthday', 'anniversary']).eq('recurring', true)
    .then(({ data, error }) => {
      const el = document.getElementById('birthdaySnapshot');
      if (error) { el.innerHTML = '<p class="event-meta">Could not load these.</p>'; return; }
      const upcoming = data
        .map(e => Object.assign({}, e, { occ: nextOccurrence(e.date) }))
        .filter(e => daysUntil(e.occ) <= 30)
        .sort((a, b) => a.occ.localeCompare(b.occ));
      if (!upcoming.length) { el.innerHTML = '<p class="event-meta">Nothing in the next month.</p>'; return; }
      el.innerHTML = upcoming.map(e => {
        const label = e.category === 'anniversary' ? yearsAt(e.date) + ' years' : 'turns ' + yearsAt(e.date);
        return '<div class="event-row" style="cursor:default"><span class="dot ' + e.category + '"></span>' +
          '<div class="event-main"><div class="event-title">' + escapeHtml(e.title) + '</div>' +
          '<div class="event-meta">' + formatDayHeading(e.occ) + ' · ' + label + '</div></div></div>';
      }).join('');
    });

  // Shopping snapshot
  window.sb.from('shopping_items').select('*').eq('checked', false).order('added_at', { ascending: true }).limit(5)
    .then(({ data, error }) => {
      const el = document.getElementById('shopSnapshot');
      if (error) { el.innerHTML = '<p class="event-meta">Could not load the list.</p>'; return; }
      if (!data.length) { el.innerHTML = '<p class="event-meta">All done — nothing outstanding.</p>'; return; }
      el.innerHTML = '<p class="event-meta">' + data.map(i => escapeHtml(i.text)).join(', ') + '</p>';
    });

  // School snapshot
  window.sb.from('school_dates').select('*').gte('date', todayISO()).order('date', { ascending: true }).limit(1)
    .then(({ data, error }) => {
      const el = document.getElementById('schoolSnapshot');
      if (error) { el.innerHTML = '<p class="event-meta">Could not load term dates.</p>'; return; }
      if (!data.length) { el.innerHTML = '<p class="event-meta">Nothing coming up.</p>'; return; }
      const e = data[0];
      el.innerHTML = '<div class="event-title">' + escapeHtml(e.title) + '</div>' +
        '<div class="event-meta">' + formatDayHeading(e.date) + '</div>';
    });

  // Holiday countdown
  window.sb.from('holidays').select('*').gte('start_date', todayISO()).order('start_date', { ascending: true }).limit(1)
    .then(({ data, error }) => {
      const el = document.getElementById('holidaySnapshot');
      if (error) { el.innerHTML = '<p class="event-meta">Could not load holidays.</p>'; return; }
      if (!data.length) { el.innerHTML = '<p class="event-meta">Nothing booked yet.</p>'; return; }
      const h = data[0];
      const n = daysUntil(h.start_date);
      el.innerHTML = '<div class="countdown-num">' + n + '</div>' +
        '<div class="countdown-label">day' + (n === 1 ? '' : 's') + ' until ' + escapeHtml(h.title) + '</div>';
    });
})();
</script>
</body>
</html>
